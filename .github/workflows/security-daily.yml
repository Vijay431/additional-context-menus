name: Security (Daily)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'pnpm-lock.yaml'
      - 'package.json'

permissions:
  contents: read
  issues: write

jobs:
  security-audit:
    name: pnpm Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install PNPM
        uses: pnpm/action-setup@v6
        with:
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22.x-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run Security Audit
        id: audit
        run: |
          echo "Running pnpm audit..."
          pnpm audit --json > audit-results.json || true

          CRITICAL=$(jq '.metadata.vulnerabilities.critical' audit-results.json)
          HIGH=$(jq '.metadata.vulnerabilities.high' audit-results.json)
          MODERATE=$(jq '.metadata.vulnerabilities.moderate' audit-results.json)
          LOW=$(jq '.metadata.vulnerabilities.low' audit-results.json)
          TOTAL=$((CRITICAL + HIGH + MODERATE + LOW))

          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
          echo "moderate=$MODERATE" >> "$GITHUB_OUTPUT"
          echo "low=$LOW" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

          {
            echo "## Security Audit Results"
            echo "| Severity | Count |"
            echo "|----------|-------|"
            echo "| Critical | $CRITICAL |"
            echo "| High | $HIGH |"
            echo "| Moderate | $MODERATE |"
            echo "| Low | $LOW |"
            echo "| **Total** | **$TOTAL** |"
          } >> audit-summary.md

      - name: Check for Outdated Packages
        id: outdated
        run: |
          echo "Checking for outdated packages..."
          pnpm outdated --json > outdated.json || true

          OUTDATED_COUNT=$(jq '. | length' outdated.json)
          echo "outdated_count=$OUTDATED_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$OUTDATED_COUNT" -gt 0 ]; then
            {
              echo ""
              echo "## Outdated Packages ($OUTDATED_COUNT)"
              echo "| Package | Current | Wanted | Latest |"
              echo "|---------|---------|--------|--------|"
              jq -r 'to_entries[] | "| \(.key) | \(.value.current) | \(.value.wanted) | \(.value.latest) |"' outdated.json
            } >> audit-summary.md
          fi

      - name: Create Security Issue for Manual Review
        if: steps.audit.outputs.critical > 0 || steps.audit.outputs.high > 0
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const auditSummary = fs.readFileSync('audit-summary.md', 'utf8');

            const title = `Security Alert: ${{ steps.audit.outputs.critical }} Critical, ${{ steps.audit.outputs.high }} High Vulnerabilities`;
            const body = `## Security Vulnerability Alert

            The daily security audit has detected **critical** or **high** severity vulnerabilities that require immediate attention.

            ${auditSummary}

            ## Next Steps

            1. **Immediate Action Required**: Review and address critical and high-severity vulnerabilities
            2. **Update Dependencies**: Run \`pnpm update\` and \`pnpm audit\` manually
            3. **Check Overrides**: Verify \`pnpm-workspace.yaml\` overrides cannot pin the safe version
            4. **Test Thoroughly**: Ensure all functionality works after updates

            ---

            *This issue was automatically created by the Daily Security Audit workflow.*
            *Audit Date: ${{ github.run_id }} | Run: ${{ github.run_number }}*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'needs triage'],
            });

      - name: Notify on Workflow Failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Daily Security Audit Failed',
              body: `## Security Audit Workflow Failure

              The daily security audit workflow has failed and requires attention.

              **Workflow Run**: ${{ github.run_id }}
              **Run Number**: ${{ github.run_number }}

              Please review the workflow logs and fix any issues preventing the security audit from running.

              ---

              *This issue was automatically created due to workflow failure.*`,
              labels: ['bug', 'github-actions', 'needs triage'],
            });

      - name: Upload Audit Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-audit-results-${{ github.run_number }}
          path: |
            audit-results.json
            outdated.json
            audit-summary.md
          retention-days: 30
