name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of an existing published release to re-run (e.g., v2.1.2)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  setup:
    name: Setup Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
      is_prerelease: ${{ steps.gate.outputs.is_prerelease }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate Release
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          ACTOR: ${{ github.triggering_actor }}
          ALLOWLIST: ${{ vars.RELEASE_WHITELIST_ACTORS }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-gate.sh

  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - name: Install PNPM
        uses: pnpm/action-setup@v6
        with:
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24.x-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Prepare Extension for Publishing
        run: pnpm run vscode:prepublish

      - name: Package Extension
        run: pnpm run package

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix-package
          path: '*.vsix'

  verifier:
    name: VSIX Verifier
    runs-on: ubuntu-latest
    needs: [release-build]
    steps:
      - name: Download VSIX Artifact
        uses: actions/download-artifact@v7
        with:
          name: vsix-package

      - name: Verify VSIX Contents
        shell: bash
        run: |
          VSIX_FILE=$(ls *.vsix | head -n 1)
          echo "Verifying: ${VSIX_FILE}"

          UNZIP_DIR=$(mktemp -d)
          unzip -q "${VSIX_FILE}" -d "${UNZIP_DIR}"

          TS_FILES=$(find "${UNZIP_DIR}" -name "*.ts" ! -name "*.d.ts" 2>/dev/null)
          if [ -n "${TS_FILES}" ]; then
            echo "ERROR: VSIX contains TypeScript source files:"
            echo "${TS_FILES}"
            exit 1
          fi

          if find "${UNZIP_DIR}" -type d -name "node_modules" | grep -q .; then
            echo "ERROR: VSIX contains node_modules directory"
            exit 1
          fi

          TEST_FILES=$(find "${UNZIP_DIR}" -type f \( -name "*.test.js" -o -name "*.spec.js" -o -name "*.test.ts" -o -name "*.spec.ts" \) 2>/dev/null)
          if [ -n "${TEST_FILES}" ]; then
            echo "ERROR: VSIX contains test files:"
            echo "${TEST_FILES}"
            exit 1
          fi

          if [ ! -f "${UNZIP_DIR}/extension/dist/extension.js" ]; then
            echo "ERROR: dist/extension.js is missing from VSIX"
            exit 1
          fi

          MANIFEST="${UNZIP_DIR}/extension/package.json"
          if [ ! -f "${MANIFEST}" ]; then
            echo "ERROR: extension/package.json not found in VSIX"
            exit 1
          fi

          check_field() {
            local field="$1"
            local value
            value=$(python3 -c "
          import json
          data = json.load(open('${MANIFEST}'))
          keys = '${field}'.split('.')
          val = data
          for k in keys:
              val = val.get(k, None)
              if val is None:
                  break
          print(val if val is not None else '')
          " 2>/dev/null)
            if [ -z "${value}" ]; then
              echo "ERROR: Required manifest field '${field}' is missing or empty"
              exit 1
            fi
            echo "Manifest field '${field}' = ${value}"
          }

          check_field "name"
          check_field "publisher"
          check_field "version"
          check_field "engines.vscode"
          check_field "repository"
          check_field "license"

  publish-vscode:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    needs: [setup, verifier]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - name: Download VSIX Artifact
        uses: actions/download-artifact@v7
        with:
          name: vsix-package

      - name: Install PNPM
        uses: pnpm/action-setup@v6
        with:
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Publish to VS Code Marketplace
        run: |
          if [ "${{ needs.setup.outputs.is_prerelease }}" = "true" ]; then
            pnpm dlx @vscode/vsce publish --packagePath *.vsix --pre-release --skip-duplicate
          else
            pnpm dlx @vscode/vsce publish --packagePath *.vsix --skip-duplicate
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish-openvsx:
    name: Publish to Open VSX Registry
    runs-on: ubuntu-latest
    needs: [setup, verifier]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - name: Download VSIX Artifact
        uses: actions/download-artifact@v7
        with:
          name: vsix-package

      - name: Install PNPM
        uses: pnpm/action-setup@v6
        with:
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Publish to Open VSX Registry
        run: |
          pnpm dlx ovsx publish *.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  attach-vsix:
    name: Attach VSIX to GitHub Release
    runs-on: ubuntu-latest
    needs: [setup, publish-vscode, publish-openvsx]
    permissions:
      contents: write
    steps:
      - name: Download VSIX Artifact
        uses: actions/download-artifact@v7
        with:
          name: vsix-package

      - name: Attach VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: gh release upload "$TAG" *.vsix --clobber
