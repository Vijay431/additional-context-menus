name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to re-run (restricted to RELEASE_WHITELIST_ACTORS)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: Release Gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
      is_prerelease: ${{ steps.gate.outputs.is_prerelease }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Release
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          ACTOR: ${{ github.actor }}
          ALLOWLIST: ${{ vars.RELEASE_WHITELIST_ACTORS }}
        run: bash .github/scripts/release-gate.sh

  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    needs: [gate]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.gate.outputs.tag }}
          persist-credentials: false

      - name: Install PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Extension for Publishing
        run: pnpm run vscode:prepublish

      - name: Package Extension
        run: pnpm run package

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vsix-package
          path: '*.vsix'

  verifier:
    name: VSIX Verifier
    runs-on: ubuntu-latest
    needs: [release-build]
    steps:
      - name: Download VSIX Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vsix-package

      - name: Verify VSIX Contents
        shell: bash
        run: |
          VSIX_FILE=$(ls *.vsix | head -n 1)
          echo "Verifying: ${VSIX_FILE}"

          # Unzip VSIX to a temp directory
          UNZIP_DIR=$(mktemp -d)
          unzip -q "${VSIX_FILE}" -d "${UNZIP_DIR}"

          # 1. Assert no .ts source files (excluding .d.ts)
          TS_FILES=$(find "${UNZIP_DIR}" -name "*.ts" ! -name "*.d.ts" 2>/dev/null)
          if [ -n "${TS_FILES}" ]; then
            echo "ERROR: VSIX contains TypeScript source files:"
            echo "${TS_FILES}"
            exit 1
          fi
          echo "✓ No .ts source files found"

          # 2. Assert no node_modules directory
          if find "${UNZIP_DIR}" -type d -name "node_modules" | grep -q .; then
            echo "ERROR: VSIX contains node_modules directory"
            exit 1
          fi
          echo "✓ No node_modules directory found"

          # 3. Assert no test files
          TEST_FILES=$(find "${UNZIP_DIR}" -type f \( -name "*.test.js" -o -name "*.spec.js" -o -name "*.test.ts" -o -name "*.spec.ts" \) 2>/dev/null)
          if [ -n "${TEST_FILES}" ]; then
            echo "ERROR: VSIX contains test files:"
            echo "${TEST_FILES}"
            exit 1
          fi
          echo "✓ No test files found"

          # 4. Assert dist/extension.js is present
          if [ ! -f "${UNZIP_DIR}/extension/dist/extension.js" ]; then
            echo "ERROR: dist/extension.js is missing from VSIX"
            exit 1
          fi
          echo "✓ dist/extension.js is present"

          # 5. Validate manifest fields for VS Code Marketplace and Open VSX
          MANIFEST="${UNZIP_DIR}/extension/package.json"
          if [ ! -f "${MANIFEST}" ]; then
            echo "ERROR: extension/package.json not found in VSIX"
            exit 1
          fi

          check_field() {
            local field="$1"
            local value
            value=$(python3 -c "
          import json, sys
          data = json.load(open('${MANIFEST}'))
          keys = '${field}'.split('.')
          val = data
          for k in keys:
              val = val.get(k, None)
              if val is None:
                  break
          print(val if val is not None else '')
          " 2>/dev/null)
            if [ -z "${value}" ]; then
              echo "ERROR: Required manifest field '${field}' is missing or empty"
              exit 1
            fi
            echo "✓ Manifest field '${field}' = ${value}"
          }

          # VS Code Marketplace required fields
          check_field "name"
          check_field "publisher"
          check_field "version"
          check_field "engines.vscode"

          # Open VSX required fields
          check_field "repository"
          check_field "license"

          echo "All VSIX verification checks passed."

  publish-vscode:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    needs: [gate, verifier]
    steps:
      - name: Download VSIX Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vsix-package

      - name: Install PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.x'

      - name: Publish to VS Code Marketplace
        run: |
          if [ "${{ needs.gate.outputs.is_prerelease }}" = "true" ]; then
            pnpm dlx vsce publish --packagePath *.vsix --pre-release --skip-duplicate
          else
            pnpm dlx vsce publish --packagePath *.vsix --skip-duplicate
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish-openvsx:
    name: Publish to Open VSX Registry
    runs-on: ubuntu-latest
    needs: [gate, verifier]
    steps:
      - name: Download VSIX Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vsix-package

      - name: Install PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.x'

      - name: Publish to Open VSX Registry
        run: |
          if [ "${{ needs.gate.outputs.is_prerelease }}" = "true" ]; then
            pnpm dlx ovsx publish *.vsix --pre-release --skip-duplicate
          else
            pnpm dlx ovsx publish *.vsix --skip-duplicate
          fi
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [gate, publish-vscode, publish-openvsx]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download VSIX Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vsix-package

      - name: Attest Build Provenance
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: '*.vsix'

      - name: Create or Update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.gate.outputs.tag }}
          IS_PRERELEASE: ${{ needs.gate.outputs.is_prerelease }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "${BUNDLE_PATH}" provenance.intoto.jsonl
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" *.vsix provenance.intoto.jsonl --clobber
          else
            flags=(--verify-tag --generate-notes)
            if [ "${IS_PRERELEASE}" = "true" ]; then flags+=(--prerelease); fi
            gh release create "${TAG}" *.vsix provenance.intoto.jsonl "${flags[@]}"
          fi
