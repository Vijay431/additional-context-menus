name: All Contributors

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  add-contributor:
    name: Add Contributor
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        startsWith(github.event.comment.body, '@all-contributors please add') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Add Requested Contributor
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          if [[ ! "$COMMENT_BODY" =~ ^@all-contributors[[:space:]]+please[[:space:]]+add[[:space:]]+@[^[:space:]]+[[:space:]]+for[[:space:]]+.+$ ]]; then
            echo "Invalid command format. Expected: @all-contributors please add @username for contributions"
            exit 1
          fi
          REQUEST="${COMMENT_BODY#@all-contributors please add }"
          USERNAME="${REQUEST%% for *}"
          CONTRIBUTIONS="${REQUEST##* for }"
          USERNAME="${USERNAME#@}"
          pnpm exec all-contributors add "${USERNAME}" "${CONTRIBUTIONS}"

      - name: Generate Contributors Table
        run: pnpm exec all-contributors generate

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'docs(contributors): update all-contributors'
          title: 'docs(contributors): update all-contributors'
          body: Updates the contributors table from all-contributors metadata.
          branch: docs/update-all-contributors
