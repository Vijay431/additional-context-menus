name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  pull-requests: read

jobs:
  setup:
    name: Warm node_modules cache
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x', '26.x']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install PNPM
        uses: pnpm/action-setup@v6
        with:
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install PNPM
        uses: pnpm/action-setup@v6
        with:
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22.x-${{ hashFiles('pnpm-lock.yaml') }}
          fail-on-cache-miss: true

      - name: Run ESLint
        run: pnpm run lint

  test-unit:
    name: Unit Tests with Coverage
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install PNPM
        uses: pnpm/action-setup@v6
        with:
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22.x-${{ hashFiles('pnpm-lock.yaml') }}
          fail-on-cache-miss: true

      - name: Run Unit Tests with Coverage
        run: pnpm run test:unit:coverage

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install PNPM
        uses: pnpm/action-setup@v6
        with:
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: Install System Dependencies
        run: sudo apt-get install -y xvfb

      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22.x-${{ hashFiles('pnpm-lock.yaml') }}
          fail-on-cache-miss: true

      - name: Build Extension
        run: pnpm run build

      - name: Run Integration Tests
        run: pnpm run test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-integration]
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x', '26.x']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install PNPM
        uses: pnpm/action-setup@v6
        with:
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}
          fail-on-cache-miss: true

      - name: Build Extension
        run: pnpm run build
        env:
          VSCODE_VERSION: stable
