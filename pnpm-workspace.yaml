allowBuilds:
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true

minimumReleaseAgeExclude:
  - tmp@0.2.7
  - qs@6.16.1

overrides:
  fast-uri: '>=4.1.5'
  nanoid: '>=3.3.18'
  serialize-javascript: '>=7.0.5'
  postcss: '>=8.5.23'
  brace-expansion: '>=5.0.12'
  diff: '>=8.0.3'
  tmp: '>=0.2.7'
  '@azure/msal-node>uuid': 11.1.1
  'typed-rest-client>qs': 6.16.1
  shell-quote: '>=1.11.0'
  form-data: '>=4.0.6'
  undici: '>=8.10.2'
  vite: '>=6.4.3'
  js-yaml: '>=5.4.1'
  markdown-it: '>=14.3.1'
  qs: '>=6.16.0'
  source-map-js: '>=1.2.2'

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 DoS: no patched release exists; reachable only via @vscode/vsce > secretlint (packaging, dev-only)
    - GHSA-vfj7-8cjw-p6xm
