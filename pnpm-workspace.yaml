allowBuilds:
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true

minimumReleaseAgeExclude:
  - tmp@0.2.7
  - qs@6.16.1
  - '@vitest/coverage-v8@5.1.2'
  - '@vitest/mocker@5.1.2'
  - '@vitest/spy@5.1.2'
  - vitest@5.1.2

overrides:
  katex: '>=0.18.2'
  linkify-it: '>=5.0.2'
  smol-toml: '>=1.9.0'
  fast-uri: '>=4.2.3'
  nanoid: '>=3.3.18'
  serialize-javascript: '>=7.1.3'
  postcss: '>=8.5.23'
  brace-expansion: '>=5.0.12'
  diff: '>=8.0.3'
  tmp: '>=0.2.7'
  '@azure/msal-node>uuid': 11.1.1
  'typed-rest-client>qs': 6.16.1
  shell-quote: '>=1.11.0'
  form-data: '>=4.0.6'
  undici: '>=8.12.2'
  vite: '>=8.1.6'
  js-yaml: '>=5.4.1'
  markdown-it: '>=15.0.3'
  qs: '>=6.16.0'
  source-map-js: '>=1.2.2'
  re2js: '>=2.8.7'
  '@azure/identity': '^4.14.1'
  glob: '^14.0.2'
  minimatch: '^11.0.1'

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 DoS: no patched release exists; reachable only via @vscode/vsce > secretlint (packaging, dev-only)
    - GHSA-vfj7-8cjw-p6xm
